<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A week-by-week plan to cut down on alcohol safely, with a daily guide in the drinks you have. Your record stays on your phone.">
<title>My Alcohol Plan</title>
<style>
:root{
  --t-bg:#FAFAFA;--t-surface:#F2F2F0;--t-card:#FFFFFF;--t-ink:#0D0D0B;--t-muted:#55534D;--t-line:#DEDDD8;
  --t-p1:#3C3158;--t-p2:#73629F;--t-p3:#AFA4CF;--t-ptint:#ECE8F4;--t-on-p1:#FAFAFA;
  --t-red:#C0392B;--t-red-ink:#A93226;--t-red-tint:#FBEDEB;--t-on-red:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --t-bg:#121210;--t-surface:#1C1B18;--t-card:#232220;--t-ink:#F2F2F0;--t-muted:#B5B3AC;--t-line:#3A3935;
    --t-p1:#DCD3F2;--t-p2:#A897D4;--t-p3:#6F5F9E;--t-ptint:#2C2740;--t-on-p1:#0D0D0B;
    --t-red:#E5695C;--t-red-ink:#F2978D;--t-red-tint:#2E1B19;--t-on-red:#0D0D0B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --t-bg:#121210;--t-surface:#1C1B18;--t-card:#232220;--t-ink:#F2F2F0;--t-muted:#B5B3AC;--t-line:#3A3935;
  --t-p1:#DCD3F2;--t-p2:#A897D4;--t-p3:#6F5F9E;--t-ptint:#2C2740;--t-on-p1:#0D0D0B;
  --t-red:#E5695C;--t-red-ink:#F2978D;--t-red-tint:#2E1B19;--t-on-red:#0D0D0B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--t-bg);color:var(--t-ink);font-family:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:var(--s-4,16px) var(--s-4,16px) calc(var(--s-11,64px) + var(--s-10,48px))}
h1,h2,h3{font-family:"Hanken Grotesk","Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1{font-size:1.35rem;margin:4px 0 12px;line-height:1.25}
h2{font-size:1.15rem;margin:0 0 8px;line-height:1.3}
h3{font-size:1rem;margin:14px 0 6px}
p{margin:0 0 10px}
.muted{color:var(--t-muted);font-size:.92rem}
.card{background:var(--t-card);border:1px solid var(--t-line);border-radius:14px;padding:16px;margin:0 0 14px}
.soft{background:var(--t-surface);border:none}
.big{font-size:2.6rem;font-weight:800;line-height:1;color:var(--t-p1)}
.big small{font-size:1rem;font-weight:600;color:var(--t-muted)}
.allow{font-size:1.25rem;font-weight:700;line-height:1.35;color:var(--t-p1);margin:2px 0 4px}
.bar{height:12px;background:var(--t-surface);border-radius:6px;overflow:hidden;margin:var(--s-2,8px) 0 var(--s-tight,6px)}
.bar>i{display:block;height:100%;background:var(--t-p1);border-radius:6px}
/* A full purple bar reads as a goal met. Reaching your drinking guide is
   not an achievement, and going past it is not a failure to punish, so the
   two states are stated plainly rather than coloured in. */
.bar.is-done>i{background:var(--t-p3)}
.bar.is-over>i{background:var(--t-red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.ic{width:1.3em;height:1.3em;fill:currentColor;flex:none;vertical-align:-.28em}
button,.btn{font:inherit;font-weight:700;border-radius:10px;border:2px solid var(--t-p1);background:var(--t-p1);color:var(--t-on-p1);padding:var(--s-3,12px) var(--s-4,16px);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
button.ghost,.btn.ghost{background:transparent;color:var(--t-p1)}
button.small{padding:6px 10px;font-size:.9rem}
button:disabled{opacity:.45;cursor:not-allowed}
.btn.wide,button.wide{width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drink{background:var(--t-surface);color:var(--t-ink);border:2px solid transparent;text-align:left;padding:10px;font-weight:600;line-height:1.3;display:block}
.drink b{display:block;color:var(--t-p1);margin-top:4px}
.drink span{display:block;font-weight:400;font-size:.85rem;color:var(--t-muted)}
.drink:active{border-color:var(--t-p1)}
.mine{background:var(--t-surface);border-radius:12px;padding:12px;margin:0 0 10px}
.mine .head{display:flex;gap:10px;align-items:flex-start}
.mine .head .ic{color:var(--t-p1);width:1.6em;height:1.6em}
.mine .acts{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:10px}
.mine .acts button{padding:10px 8px}
.seg{display:flex;background:var(--t-surface);border-radius:10px;padding:var(--s-1,4px);gap:var(--s-1,4px)}
.seg button{flex:1;background:transparent;border:none;color:var(--t-ink);padding:8px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--t-card);color:var(--t-p1);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{background:var(--t-surface);color:var(--t-ink);border:2px solid transparent;font-weight:600;padding:8px 12px}
.pills button[aria-pressed="true"]{border-color:var(--t-p1);color:var(--t-p1);background:var(--t-ptint)}
.lbl{font-weight:600;margin:12px 0 6px}
label.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--t-line)}
label.chk:last-child{border-bottom:none}
label.chk input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--t-p1)}
input[type=number],input[type=text],input[type=tel],input[type=date],textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--t-line);border-radius:10px;background:var(--t-card);color:var(--t-ink)}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-weight:600;margin-bottom:4px}
.field>small{display:block;margin-top:4px}
ul.log{list-style:none;padding:0;margin:0}
ul.log li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--t-line)}
ul.log li:last-child{border-bottom:none}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--t-line);vertical-align:top}
th{font-size:.82rem;color:var(--t-muted);font-weight:600}
tr.now td{background:var(--t-ptint);font-weight:700}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:280px;margin:8px 0}
.dot{aspect-ratio:1;border-radius:50%;border:2px solid var(--t-p3);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--t-muted)}
.dot.done{background:var(--t-p1);border-color:var(--t-p1);color:var(--t-on-p1)}
.dot.today{border-color:var(--t-p1);border-width:3px;color:var(--t-p1);font-weight:800}
.note{padding:10px 12px;background:var(--t-ptint);border-radius:10px;margin:0 0 12px}
.warn{border:2px solid var(--t-red);background:var(--t-red-tint);border-radius:14px;padding:16px;margin:var(--s-5,20px) 0 var(--s-mid,14px)}
.warn h2{color:var(--t-red-ink);display:flex;gap:6px;align-items:center}
.warn h3{margin-top:12px}
.warn ul{margin:4px 0 10px;padding-left:20px}
.warn .btn{background:var(--t-red);border-color:var(--t-red);color:var(--t-on-red);margin:4px 0}
.warn.top{margin-top:0}
.takeover h1{font-size:1.6rem}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--t-card);border-top:1px solid var(--t-line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{display:flex;max-width:560px;width:100%}
.tabbar button{flex:1;flex-direction:column;gap:2px;background:transparent;border:none;border-radius:0;color:var(--t-muted);padding:8px 2px 10px;font-size:.75rem;font-weight:600;min-width:0}
.tabbar button .ic{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--t-p1);box-shadow:inset 0 3px 0 var(--t-p1)}
.tab{display:none}.tab.on{display:block}
pre{white-space:pre-wrap;word-wrap:break-word;font-family:inherit;font-size:.88rem;background:var(--t-surface);padding:12px;border-radius:10px;margin:0 0 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--t-ink);color:var(--t-bg);padding:10px 16px;border-radius:10px;font-weight:600;display:none;z-index:9;max-width:90%}
.toast.on{display:block}
svg text{font-family:inherit}
.hidden{display:none!important}
details.card>summary{cursor:pointer}
.terms h3{margin-top:var(--s-5,20px)}
.terms p{font-size:.95rem}
ul.keys{margin:0;padding-left:20px}
ul.keys li{margin:0 0 8px}
@media print{
  .tabbar,.warn,header,.noprint,.toast{display:none!important}
  .tab{display:none!important}
  #tab-summary{display:block!important}
  body{background:#fff;color:#000}
  pre{background:#fff;font-size:11pt}
}

/* ===== Setup, one screen at a time ===================================
   Spacing comes from the Pákó scale (--s-*). The fallbacks are for the
   patient copy on github.io, which does not load miro.css. */
.tp-step[hidden]{display:none}
.tp-step-sub{margin:0 0 var(--s-4,16px)}
.tp-prog{margin:0 0 var(--s-7,28px)}
.tp-prog-bar{height:6px;border-radius:9999px;background:var(--t-ptint);overflow:hidden}
.tp-prog-bar span{display:block;height:100%;width:0;border-radius:9999px;background:var(--t-p1);transition:width 350ms ease}
.tp-prog-count{margin:var(--s-snug,10px) 0 0}
.tp-nav{display:flex;align-items:center;gap:var(--s-4,16px);margin-top:var(--s-7,28px);flex-wrap:wrap}
.tp-nav [hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){.tp-prog-bar span{transition:none}}

/* ===== Today: a vessel and a dial ===================================
   Both are buttons. Hover, focus or tap one and the line underneath says
   what it means; it is filled in on load so a touch screen loses nothing. */
/* Two cards, side by side: the week and today. Each is a figure with its
   words beside it. */
.tp-grid{display:grid;gap:var(--s-3,12px);grid-template-columns:1fr 1fr;align-items:stretch}
.tp-tile{
  background:var(--t-card);border-radius:var(--r-card,20px);padding:var(--s-5,20px);
  display:flex;align-items:center;gap:var(--s-5,20px);min-width:0;
}
.tp-tile>.tp-vessel,.tp-tile>.tp-dial{flex:none}
.tp-tile-words{min-width:0;display:flex;flex-direction:column;gap:var(--s-2,8px)}
.tp-tile-note{margin:0;color:var(--t-muted)}
.tp-tile-hero{margin:0;font-weight:600;color:var(--t-ink)}

/* The day's line is in the flow from the start and only fades, so hovering
   never pushes the card taller. Below 900px there is no hover to wait for. */
@media (min-width:901px){
  .tp-reveal{opacity:0;transition:opacity 180ms ease}
  .tp-tile-day:hover .tp-reveal,.tp-tile-day:focus-within .tp-reveal{opacity:1}
}
@media (prefers-reduced-motion: reduce){.tp-reveal{transition:none}}
@media (max-width:620px){.tp-grid{grid-template-columns:1fr}}
.tp-vessel,.tp-dial{
  background:none;border:0;padding:var(--s-2,8px);margin:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:var(--s-1,4px);
  border-radius:var(--r-panel,12px);min-height:0;
}
.tp-vessel svg{width:96px;height:auto;display:block}
.tp-dial svg{width:112px;height:auto;display:block}
/* No hover plate. The figures already answer by brightening, and a grey
   disc behind a bottle just looks like a smudge. */
.tp-vessel:focus-visible,.tp-dial:focus-visible{outline:2px solid var(--t-p1);outline-offset:2px}

.tp-v-body{fill:var(--t-surface)}
.tp-v-line{stroke:var(--t-p3)}
.tp-v-cap{fill:var(--t-p3)}
.tp-v-fill{fill:var(--t-p2)}
/* The bloom from the Pause dashboard. Each figure carries its own, in
   whatever colour it is currently showing, so the state reads before the
   number does. */
.tp-vessel{--glow:rgba(115,107,135,.55)}
.tp-dial{--glow:rgba(60,49,88,.42)}
.tp-vessel.is-done,.tp-vessel.is-over,.tp-dial.is-over{--glow:rgba(192,57,43,.38)}
.tp-dial.is-done{--glow:rgba(204,201,212,.6)}
.tp-v-fill,.tp-dial-arc{filter:drop-shadow(0 0 9px var(--glow))}
.tp-vessel.is-over .tp-v-line{filter:drop-shadow(0 0 9px var(--glow))}
@media (prefers-reduced-motion: no-preference){
  .tp-v-fill,.tp-dial-arc{transition:filter 300ms ease}
}
.tp-vessel.is-done .tp-v-fill,.tp-vessel.is-over .tp-v-fill{fill:var(--t-red)}
/* Past the guide there is no liquid left to colour, so an empty outline
   looked the same as a day gone exactly to plan. The vessel itself carries
   the state instead. */
.tp-vessel.is-over .tp-v-body{fill:var(--t-red-tint)}
.tp-vessel.is-over .tp-v-line,.tp-vessel.is-over .tp-v-cap{stroke:var(--t-red);fill:var(--t-red)}
.tp-vessel.is-over .tp-v-line{fill:none}
.tp-vessel.is-over .tp-dial-big{color:var(--t-red-ink)}

.tp-dial-track{stroke:var(--t-surface)}
.tp-dial-arc{stroke:var(--t-p1)}
.tp-dial.is-done .tp-dial-arc{stroke:var(--t-p3)}
.tp-dial.is-over .tp-dial-arc{stroke:var(--t-red)}
.tp-dial-num{font-weight:700;font-size:26px;fill:var(--t-ink)}
.tp-dial-of{font-size:13px;fill:var(--t-muted)}

.tp-dial-big{font-weight:700;color:var(--t-ink);font-size:1.05rem}
.tp-dial-label{color:var(--t-muted);font-size:.92rem}
.tp-dial-note{margin:var(--s-3,12px) 0 0;min-height:3em}
@media (max-width:420px){
  .tp-dials{gap:var(--s-3,12px)}
  .tp-vessel svg{width:78px}
  .tp-dial svg{width:92px}
}
</style>
</head>

<script>
(function(){
'use strict';
var KEY='myAlcoholPlan.v1';
/* One file, two homes. On github.io it is a doctor's tool for one patient. Anywhere else
   (pako.health) it is the public version: no doctor needed, and it can start from the
   answers on Check your drinking, which leaves them in sessionStorage. */
var PUBLIC=!/github\.io$/.test(location.hostname);
var PUBLIC_TARGET=14, PUBLIC_CUT=0.2;
var AUDIT_URL='/habit-lab/check-your-drinking/';
/* Where "I don't agree" goes. On pako.health that is the lab the card came
   from, not the screening test most of these readers never took. */
var EXIT_URL=PUBLIC?'/habit-lab':AUDIT_URL;
var PREFILL_KEY='pako-taper-prefill';
function weeksFor(S,T){
  if(!(S>0)||!(T>=0)||T>=S)return '';
  /* Stopping altogether is a straight line down, so the weeks have to come
     from how far there is to fall. Twelve for everybody meant a light
     drinker crawling down in one-unit steps while someone on 42 dropped
     3.5 units every week. Four units a week is the step: a heavier week
     buys more weeks. The floor of four stops anyone being handed a
     two-week stop, and twelve is all the form allows. */
  if(T===0)return Math.max(4,Math.min(12,Math.ceil(S/4)));
  return Math.max(1,Math.min(12,Math.ceil(Math.log(T/S)/Math.log(1-PUBLIC_CUT))));
}
function prefill(){
  if(!PUBLIC)return null;
  try{
    var p=JSON.parse(sessionStorage.getItem(PREFILL_KEY)||'null');
    if(!p||typeof p!=='object')return null;
    var weekly=Math.round(+p.weekly);
    var drinks=(Array.isArray(p.drinks)?p.drinks:[]).filter(function(d){
      return d&&CATS[d.cat]&&+d.ml>0&&+d.pct>0&&+d.pct<=96;
    }).slice(0,MAX_MINE).map(function(d){return {cat:d.cat,size:+d.size|0,ml:+d.ml,pct:+d.pct,name:''};});
    return {weekly:weekly>0?weekly:'',drinks:drinks};
  }catch(e){return null;}
}
/* Drink kinds for "My drinks". Strengths: beer, wine, spirits, bitters from the brief.
   Stout 7.5% = Guinness Foreign Extra Stout. Strong rum 69% = Clarke's Court Pure White and
   Rivers Royale (export bottling) in Grenada. Rivers sold at home in Grenada is often 75%. */
var CATS={
  beer:{name:'Beer or lager',short:'beer',icon:'sports_bar',pct:5,ph:'For example: Carib',
    sizes:[{ml:330,n:'small bottle'},{ml:330,n:'can'},{ml:600,n:'large bottle'}],noun:'bottle'},
  stout:{name:'Stout',short:'stout',icon:'sports_bar',pct:7.5,ph:'For example: Guinness',
    sizes:[{ml:330,n:'small bottle'},{ml:600,n:'large bottle'}],noun:'bottle'},
  wine:{name:'Wine',short:'wine',icon:'wine_bar',pct:13,ph:'',
    sizes:[{ml:125,n:'small glass'},{ml:175,n:'glass'},{ml:750,n:'bottle'}],noun:'glass'},
  spirits:{name:'Spirits (gin, whisky, vodka, rum)',short:'spirits',icon:'liquor',pct:40,ph:'For example: gin',
    sizes:[{ml:35,n:'shot'},{ml:200,n:'flask'},{ml:375,n:'medium bottle'},{ml:750,n:'bottle'}],noun:'bottle'},
  overproof:{name:'Strong rum (overproof)',short:'strong rum',icon:'liquor',pct:69,ph:'For example: Clarke\'s Court',
    sizes:[{ml:35,n:'shot'},{ml:200,n:'flask'},{ml:750,n:'bottle'}],noun:'bottle'},
  bitters:{name:'Herbal bitters',short:'bitters',icon:'liquor',pct:40,ph:'',
    sizes:[{ml:35,n:'shot'},{ml:200,n:'small bottle'}],noun:'bottle'},
  other:{name:'Something else',short:'',icon:'local_bar',pct:'',ph:'For example: palm wine',
    sizes:[{ml:null,n:'glass'},{ml:null,n:'cup'},{ml:null,n:'can'},{ml:null,n:'bottle'}],noun:'glass'}
};
var CAT_ORDER=['beer','stout','wine','spirits','overproof','bitters','other'];
var MAX_MINE=3;
var DRINKS=[
  {name:'Large bottle of beer',ml:600,pct:5,icon:'sports_bar'},
  {name:'Can of beer',ml:330,pct:5,icon:'sports_bar'},
  {name:'Large bottle of stout',ml:600,pct:7.5,icon:'sports_bar'},
  {name:'Glass of wine',ml:175,pct:13,icon:'wine_bar'},
  {name:'Shot of spirits',ml:35,pct:40,icon:'liquor'},
  {name:'Shot of strong rum',ml:35,pct:69,icon:'liquor'},
  {name:'Small bottle of herbal bitters',ml:200,pct:40,icon:'liquor'},
  {name:'Bottle of spirits',ml:750,pct:40,icon:'liquor'}
];
var SIGNS_DOC=[
  {id:'shake',text:'My hands shook in the morning'},
  {id:'sick',text:'I was sweating, felt sick or vomited in the morning'},
  {id:'early',text:'I needed a drink early in the day to feel normal'}
];
var SIGNS_AMB=[
  {id:'fit',text:'I had a fit (seizure)'},
  {id:'confused',text:'I felt confused'},
  {id:'seeing',text:'I saw or heard things that were not there'},
  {id:'double',text:'I saw double'},
  {id:'unsteady',text:'I was unsteady on my feet'}
];
var SLEEP=['Well','Okay','Badly'];
var CRAVE=['None','A little','Strong','Very strong'];
var DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var WA_MAX=1000;

/* ---------- storage ---------- */
var memState=null, storageOK=true;
function load(){
  try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}
  catch(e){storageOK=false;return memState;}
}
function save(){
  memState=state;
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e){storageOK=false;}
}
var state=load()||{};
state.settings=state.settings||null;
state.drinks=state.drinks||{};
state.checkins=state.checkins||{};
state.custom=state.custom||[];
state.myDrinks=state.myDrinks||[];
state.overPrompted=state.overPrompted||{};
/* version 1 kept a plain phone number for the doctor */
if(state.settings&&state.settings.doctorWa==null){
  var mig=normWa(state.settings.doctorPhone);
  state.settings.doctorWa=mig.ok?mig.d:'';
  state.settings.patientName=state.settings.patientName||'';
}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function r1(n){return Math.round(n*10)/10;}
function fmt(n){var v=r1(n);return (v%1===0)?String(v):v.toFixed(1);}
function half(n){return Math.round(n*2)/2;}
function unitsOf(ml,pct){return ml*pct/1000;}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseKey(k){var a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return key(d);}
function diffDays(a,b){return Math.round((parseKey(b)-parseKey(a))/86400000);}
function today(){return key(new Date());}
function nice(k){var d=parseKey(k);return DAYN[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
function niceY(k){return nice(k)+' '+parseKey(k).getFullYear();}
function doc(){return (state.settings&&state.settings.doctorName)?state.settings.doctorName:(PUBLIC?'a doctor':'your doctor');}
function Doc(){var d=doc();return d.charAt(0).toUpperCase()+d.slice(1);}
function plural(n,w){return n+' '+w+(n===1?'':'s');}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function ic(n){return '<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},2600);}
function clone(o){return JSON.parse(JSON.stringify(o));}

/* ---------- WhatsApp ---------- */
function normWa(raw){
  var s=String(raw||'').trim();if(!s)return {ok:true,d:''};
  var plus=s.charAt(0)==='+',d=s.replace(/\D/g,'');
  if(!plus&&d.indexOf('00')===0)d=d.slice(2);
  if(d.charAt(0)==='0')return {ok:false,msg:'Start the WhatsApp number with the country code, not 0. For example, 1 473 for Grenada.'};
  if(d.length<8||d.length>15)return {ok:false,msg:'Check the WhatsApp number. It looks too short or too long.'};
  return {ok:true,d:d};
}
function hasWa(){return !!(state.settings&&state.settings.doctorWa);}
function waLink(text){return 'https://wa.me/'+state.settings.doctorWa+'?text='+encodeURIComponent(text);}
function waBtn(text,label,extra){return '<a class="btn'+(extra?' '+extra:'')+'" target="_blank" rel="noopener" href="'+esc(waLink(text))+'">'+ic('chat')+esc(label)+'</a>';}
function waDelay(){return '<p class="muted" style="margin-top:10px">'+esc(Doc())+' may not see your message straight away. If you have any sign on the ambulance list, call the ambulance first.</p>';}
function who(){var n=state.settings&&state.settings.patientName;return n?n:'Patient';}
function clip(t){return t.length>WA_MAX?t.slice(0,WA_MAX-3)+'...':t;}

/* ---------- my drinks ---------- */
function newDrink(cat){var c=CATS[cat],s=c.sizes[0];return {cat:cat,size:0,ml:s?s.ml:null,pct:c.pct,name:''};}
function dUnits(d){return unitsOf(+d.ml,+d.pct);}
function dNoun(d){var c=CATS[d.cat];return d.size>=0&&c.sizes[d.size]?c.sizes[d.size].n:c.noun;}
function dWhat(d){return d.name||CATS[d.cat].short;}
function pl(n){return /ss$/.test(n)?n+'es':n+'s';}
function amount(c,noun){
  if(c===0.5)return 'half a '+noun;
  return Math.floor(c)+(c%1?' and a half ':' ')+(c>1?pl(noun):noun);
}
function dLabel(d,f){return cap((f===0.5?'half a ':'')+dNoun(d))+' of '+dWhat(d);}
function smallest(d){
  var best=null;CATS[d.cat].sizes.forEach(function(s){if(s.ml&&s.ml<+d.ml&&(!best||s.ml<best.ml))best=s;});
  return best;
}
/* How much of this drink fits in u units. Rounds down to a half, so it never shows more than the plan.
   Under one container, it uses the smallest container of the same kind instead. */
function fit(u,d){
  var cu=dUnits(d);if(!(cu>0)||!(u>0))return null;
  var c=Math.floor(u/cu*2)/2;
  if(c>=1)return {c:c,noun:dNoun(d)};
  var sm=smallest(d),c2=0;
  if(sm){c2=Math.floor(u/unitsOf(sm.ml,+d.pct)*2)/2;if(c2>=1)return {c:c2,noun:sm.n};}
  if(c>=0.5)return {c:0.5,noun:dNoun(d)};
  if(c2>=0.5)return {c:0.5,noun:sm.n};

}

}

/* ---------- plan maths ---------- */
function buildPlan(s){
  /* The daily guide is the week spread over all 7 days, rounded down to a half
     unit, and it never goes up from one week to the next. Dry days are allowed
     (up to 2, from week 3, once a day is 4 units or less) but do not raise it:
     sharing the week over fewer days made drinking days bigger. */
  /* The steps are proportional — take the same percentage off each week —
     which is the shape a taper should have. It cannot reach zero, though:
     (0/S)^(1/N) is 0, so every week came out as 0 and the plan told
     someone on 42 units a week to drink nothing from week one. That is the
     abrupt stop the page warns against on the screen above it. A target of
     nothing steps down in equal amounts instead, and only the last week is
     dry. */
  var S=+s.start,T=+s.target,N=+s.weeks,out=[],prev=Infinity;
  var toZero=!(T>0);
  var r=toZero?0:Math.pow(T/S,1/N);
  for(var k=1;k<=N;k++){
    var w=(k===N)?T:(toZero?Math.round(S*(N-k)/N):Math.round(S*Math.pow(r,k)));
    var dry=0;
    if(k>=3&&w/7<=4)dry=2;
    var daily=Math.min(prev,Math.floor(w/7*2)/2);prev=daily;
    out.push({n:k,weekly:w,dry:dry,daily:daily});
  }
  return out;
}
function plan(){return buildPlan(state.settings);}
function info(k){
  var s=state.settings;
  /* No plan was given, on safety grounds. buildPlan would divide by a
     zero-week taper, so it is never called. */
  if(s.diary)return {phase:'diary',week:0,weekly:0,daily:0,dry:0,day:diffDays(s.startDate,k)+1};
  var p=plan(),d=diffDays(s.startDate,k);
  if(d<0)return {phase:'before',daysTo:-d,week:0,weekly:+s.start,daily:half(s.start/7),dry:0};
  var wk=Math.floor(d/7)+1;
  if(wk>p.length){var L=p[p.length-1];return {phase:'after',week:wk,weekly:L.weekly,daily:L.daily,dry:L.dry,day:d+1};}
  var w=p[wk-1];
  return {phase:'plan',week:wk,weekly:w.weekly,daily:w.daily,dry:w.dry,day:d+1};
}
function weekStart(wk){return addDays(state.settings.startDate,(wk-1)*7);}
function dayTotal(k){return (state.drinks[k]||[]).reduce(function(a,x){return a+x.u;},0);}
function weekTotal(wk){var s=weekStart(wk),t=0;for(var i=0;i<7;i++){var d=addDays(s,i);if(d<=today())t+=dayTotal(d);}return t;}
function hasRecord(k){return (state.drinks[k]&&state.drinks[k].length>0)||!!state.checkins[k];}

/* ---------- warning level ---------- */
function warnLevel(){
  var c=state.checkins[today()];
  if(!c||c.cleared)return 0;
  var s=c.signs||[];
  if(s.some(function(id){return SIGNS_AMB.some(function(x){return x.id===id;});}))return 2;
  return s.length?1:0;
}
function signText(id){var x=SIGNS_DOC.concat(SIGNS_AMB).filter(function(z){return z.id===id;})[0];return x?x.text:id;}

/* ---------- red panel: the only red element ---------- */
function warnPanel(level){
  var s=state.settings||{},amb='',dr='';
  amb='<h3>Call an ambulance now if you have any of these</h3><ul>'+
    '<li>A fit (seizure)</li><li>You feel confused</li><li>You see or hear things that are not there</li>'+
    '<li>You see double</li><li>You are unsteady on your feet</li></ul>'+
    (s.emergency?'<a class="btn wide" href="tel:'+esc(s.emergency.replace(/[^\d+]/g,''))+'">'+ic('call')+'Call the ambulance: '+esc(s.emergency)+'</a>':'');
  dr='<h3>Contact '+esc(doc())+' today if you have any of these</h3><ul>'+
    '<li>Your hands shake in the morning, and a drink settles them</li>'+
    '<li>You sweat, feel sick or vomit in the morning</li>'+
    '<li>You need a drink early in the day to feel normal</li></ul>'+
    '<p>Do not cut down any further until you have spoken to '+esc(doc())+'.</p>'+
    (s.doctorWa?'<a class="btn" href="tel:+'+esc(s.doctorWa)+'">'+ic('call')+'Call '+esc(doc())+'</a>':'');
  var head=level===2?'<h2>'+ic('warning')+'Get help now</h2><p>You ticked a sign that needs help straight away.</p>':
           level===1?'<h2>'+ic('warning')+'Contact '+esc(doc())+' today</h2><p>You ticked a warning sign today.</p>':
           '<h2>'+ic('warning')+'Warning signs</h2>';
  var body=level===1?(dr+amb):(amb+dr);
  return '<section class="warn'+(level?' top':'')+'" aria-live="polite">'+head+body+'</section>';

function warnMsg(){
  var t=today(),c=state.checkins[t]||{},i=info(t),L=[];
  L.push(who()+': alcohol plan. Warning signs on '+niceY(t)+':');
  (c.signs||[]).forEach(function(id){L.push('- '+signText(id));});

  if(c.note)L.push('Note: '+c.note);
  return clip(L.join('\n'));
}

  }
  function waOut(){
    var n=normWa($('#sWa').value),o=$('#waOut');

  }
  /*
   * The safety gate.

   * This used to let anyone through. Answer "yes, I have had a fit or seen
   * things when I stopped", tick "my doctor has checked this and says I can
   * start", and the app handed you a taper plan. Nobody can verify that tick,
   * and withdrawal seizures and delirium are the two things on this page that
   * actually kill people. So on the public copy there is no tick: a yes ends
   * the setup, and a "not sure" ends it too, both with somewhere to go next.
   *
   * The copy a doctor fills in with a patient keeps the checkbox, because
   * there the person confirming really is the clinician.
   */
  function stopReason(){
    if(!PUBLIC)return '';

        (r==='yes'
          ? 'A fit or seeing things after stopping means your body has come to depend on alcohol. Cutting down without a doctor can bring that on again, and it can kill. You need someone to look after you while you do this.'
          : 'If you are not sure, treat it as a yes until a doctor tells you otherwise. It takes one appointment to find out.')+
        '</p><p>You can still keep a record of what you drink. Take it with you \u2014 it is the first thing a doctor will ask about.</p>'+

          morning:morn,diary:true};

  function mornMsg(){

      ? '<div class="note" style="margin-top:12px"><p><b>Tell a doctor about this before you start.</b> Needing a drink in the morning means your body has adjusted to alcohol. Cutting down is still the right idea, but go slowly, never stop all at once, and get someone to check on you.</p></div>'

  }

  if(PUBLIC)['#sStart','#sTarget'].forEach(function(id){$(id).addEventListener('input',function(){

      if(/emergency/i.test(err))tpShow(stepOf('#sEm'));
      else if(/drink|strength|size/i.test(err))tpShow(stepOf('#ed'));
      else if(/\+|country code|whatsapp/i.test(err))tpShow(stepOf('#sWa'));
      else tpShow(stepOf('#sStart'));

    }
    state.settings=v;state.myDrinks=clone(ed);state.editing=false;save();
    try{sessionStorage.removeItem(PREFILL_KEY);}catch(e){}

  }
  /* ---- one screen at a time ------------------------------------------
     Six screens. Three of them hold Next back until they have what the
     plan cannot be built without: the safety question, the emergency
     number, and the numbers themselves. The rest you can walk past. */
  var steps=[].slice.call(document.querySelectorAll('.tp-step'))
  var at=0
  /* Keyed off what is on the screen, not its number: the calculator screen
     only exists on a first run, so the numbers shift by one without it. */
  function stepOf(sel){
    var el=document.querySelector(sel)
    var sec=el&&el.closest('.tp-step')
    return sec?+sec.dataset.step:1
  }
  function ready(n){
    if(n===stepOf('#sHist')){
      if(!hist||!morn)return false
      if(stopReason())return false      /* there is nowhere to go next */
      return hist==='No'||ok
    }
    if(n===stepOf('#sEm'))return !!$('#sEm').value.trim()
    return true
  }
  function tpShow(n,moving){
    at=Math.max(1,Math.min(steps.length,n))
    steps.forEach(function(el){el.hidden=+el.dataset.step!==at})
    $('#tpProgFill').style.width=(at/steps.length*100)+'%'
    $('#tpProgCount').textContent='Step '+at+' of '+steps.length

      var f=steps[at-1].querySelector('input,button')
      if(f&&f.type!=='button')f.focus({preventScroll:true})
    }
  }
  function tpSync(){
    var last=at===steps.length

    $('#sGo').hidden=!last
    gate()
  }
  $('#tpBack').onclick=function(){tpShow(at-1,true)}
  $('#tpNext').onclick=function(){tpShow(at+1,true)}
  /* An answer can unlock Next without changing screen. */
  document.querySelector('#app').addEventListener('input',tpSync)
  document.querySelector('#app').addEventListener('change',tpSync)
  $('#sHist').addEventListener('click',function(){setTimeout(tpSync,0)})

/* The calculator's rows, keyed by their units, as drink kinds and sizes. Same map as audit.html. */
var CALC_DRINKS={
  '3':{cat:'beer',size:2,ml:600,pct:5},'1.7':{cat:'beer',size:1,ml:330,pct:5},
  '2.3':{cat:'wine',size:1,ml:175,pct:13},'1.4':{cat:'spirits',size:0,ml:35,pct:40},
  '8':{cat:'bitters',size:1,ml:200,pct:40},'30':{cat:'spirits',size:3,ml:750,pct:40}
};
function calcRead(tool){
  var total=0,rows=[];
  Array.prototype.forEach.call(tool.querySelectorAll('.pk-u-step[data-units]'),function(step){
    var n=parseFloat(step.querySelector('input').value);if(!isFinite(n)||n<=0)return;
    var u=parseFloat(step.dataset.units);total+=n*u;
    if(CALC_DRINKS[step.dataset.units])rows.push({n:n,u:n*u,d:CALC_DRINKS[step.dataset.units]});
  });
  rows.sort(function(a,b){return b.n-a.n||b.u-a.u;});
  return {total:total,drinks:rows.slice(0,MAX_MINE).map(function(r){return {cat:r.d.cat,size:r.d.size,ml:r.d.ml,pct:r.d.pct,name:''};})};
}

/* ---------- plan ---------- */
/* One drink in the table keeps it readable; Today shows all of them. */
function tableHTML(p,cur,drinks){
  var d=(drinks||state.myDrinks).filter(function(x){return dUnits(x)>0;})[0];
  var h='<table><thead><tr><th>Week</th><th>Units a week</th><th>A day</th></tr></thead><tbody>';
  p.forEach(function(w){
    var f=d&&fit(w.daily,d);
    h+='<tr'+(w.n===cur?' class="now"':'')+'><td>'+w.n+'</td><td>'+w.weekly+'</td><td>'+
      /* Once the week drops under about 3.5 units the daily share rounds
         down to nothing, so the row read "2 | 0 units" — the week gives
         you two and the day says none. Say what is actually true: the
         units are there, just not every day. */
      (w.daily===0&&w.weekly>0
        ? esc(plural(w.weekly,'unit'))+' <span class="muted">across the week</span>'
        : f?esc(cap(amount(f.c,f.noun)))+' <span class="muted">'+esc(plural(w.daily,'unit'))+'</span>'
           :esc(plural(w.daily,'unit')))+'</td></tr>';
  });
  h+='</tbody></table>';
  var dw=p.filter(function(w){return w.dry>0;})[0];
  if(dw)h+='<p class="muted" style="margin-top:8px">From week '+dw.n+', you can have up to 2 days a week with no alcohol. Don\'t drink more on the other days.</p>';
  /* The form stops at twelve weeks. Up to about 48 units a week that is
     enough to come down roughly four units at a time; past it the same
     twelve weeks make each step bigger, which is the wrong way round. Say
     so rather than quietly handing over a steeper plan. */
  if(p.length>1&&p[p.length-1].weekly===0){
    /* p[0] is week one's target, already a step below where they are now,
       so the starting amount is one more step up again. */
    var step=p[0].weekly-p[1].weekly;
    var from=p[0].weekly+step;
    if(step>4.5)h+='<div class="note" style="margin-top:12px"><p><b>This is a big drop each week.</b> Twelve weeks is as long as this plan goes, so coming down from '+plural(from,'unit')+' a week means losing about '+plural(step,'unit')+' every week. Talk to a doctor about stopping with support rather than doing it this fast on your own.</p></div>';
  }
  return h;
}

}

  if(inPlan)L.push('Days at or under the daily guide: '+onT+' of '+inPlan+'.');
  L.push(warn.length?'Warning signs:\n- '+warn.join('\n- '):'Warning signs: none ticked.');
  var last=[];for(var j=6;j>=0;j--){var kk=addDays(t,-j);if(kk>=from)last.push(nice(kk).slice(0,3)+' '+(hasRecord(kk)?fmt(dayTotal(kk)):'-'));}
  var withLast=L.concat(['Last 7 days (units): '+last.join(', ')+'.']).join('\n');
  return clip(withLast.length<=WA_MAX?withLast:L.join('\n'));
}
function summaryHTML(){
  return '<div class="card"><h2>For your doctor</h2><p>Show this to '+esc(doc())+' at your visit, or send it before. It also keeps a copy of your record.</p>'+
    (hasWa()?'<div class="noprint" style="margin-bottom:12px">'+waBtn(summaryShort(),'Send to '+doc(),'wide')+'<p class="muted" style="margin:6px 0 0">This sends a short version.</p></div>':'')+
    '<div class="row noprint" style="margin-bottom:12px"><button class="ghost" id="copy">Copy</button>'+(navigator.share?'<button class="ghost" id="share">Send</button>':'')+'<button class="ghost" id="print">Print</button></div>'+
    '<pre id="sumText">'+esc(summaryText())+'</pre>'+(hasWa()?'<div class="noprint">'+waDelay()+'</div>':'')+'</div>';
}
function copyText(txt){
  function fallback(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);toast(ok?'Copied':'Could not copy. Press and hold the text to copy it.');}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(function(){toast('Copied');},fallback);}else fallback();
}

/* ---------- events ---------- */
function bindMain(){
  var app=document.getElementById('app');
  var n=$('#noted');if(n)n.onclick=function(){state.storageNoted=true;save();render();};
  /* The reveal is CSS now — :hover and :focus-within on the day card — so
     there is no shared caption to drive from here. The buttons keep their
     aria-labels, which carry the same sentence for a screen reader. */
  var ld=$('#logDay');if(ld)ld.onclick=function(e){var b=e.target.closest('button');if(!b)return;logDay=b.dataset.d;render();};
  var mine=$('#mine');if(mine)mine.onclick=function(e){var b=e.target.closest('button[data-mine]');if(!b)return;
    var d=state.myDrinks[+b.dataset.mine],f=+b.dataset.f;addDrink(dLabel(d,f),d.ml*f,+d.pct);};
  var em=$('#editMine');if(em)em.onclick=function(){ed=state.myDrinks.length?clone(state.myDrinks):[{cat:'',size:0,ml:null,pct:'',name:''}];editingDrinks=true;render();window.scrollTo(0,0);};
  var os=$('#overSend');if(os)os.addEventListener('click',function(){state.overCard=null;save();setTimeout(render,300);});
  var on=$('#overNo');if(on)on.onclick=function(){state.overCard=null;save();render();};
  var g=$('#drinkGrid');if(g)g.onclick=function(e){var b=e.target.closest('button');if(!b)return;var d=DRINKS.concat(state.custom)[+b.dataset.ix];addDrink(d.name,d.ml,d.pct);};
  var cMl=$('#cMl'),cPct=$('#cPct');
  if(cMl){var upd=function(){var ml=+cMl.value,pc=+cPct.value;$('#cUnits').textContent=(ml>0&&pc>0)?'That is '+fmt(unitsOf(ml,pc))+' units.':'The units will show here.';};cMl.oninput=upd;cPct.oninput=upd;
    $('#cAdd').onclick=function(){var ml=+cMl.value,pc=+cPct.value;if(!(ml>0&&pc>0&&pc<=96)){toast('Enter millilitres and alcohol %');return;}
      var nm=$('#cName').value.trim()||(ml+'ml at '+pc+'%');
      addDrink(nm,ml,pc);};}
  var u=$('#undo');if(u)u.onclick=function(){var day=logDay==='today'?today():addDays(today(),-1);var l=state.drinks[day];if(l&&l.length){var x=l.pop();save();render();toast('Removed '+x.name);}};
  Array.prototype.forEach.call(app.querySelectorAll('[data-del]'),function(b){b.onclick=function(){var day=logDay==='today'?today():addDays(today(),-1);state.drinks[day].splice(+b.dataset.del,1);save();render();};});
  Array.prototype.forEach.call(app.querySelectorAll('.pills[data-f]'),function(el){el.onclick=function(e){var b=e.target.closest('button');if(!b)return;draft[el.dataset.f]=b.textContent;
    Array.prototype.forEach.call(el.children,function(x){x.setAttribute('aria-pressed',x===b);});};});
  var sg=$('#signs');if(sg)sg.onchange=function(){draft.signs=Array.prototype.map.call(sg.querySelectorAll('input:checked'),function(x){return x.value;});};
  var cn=$('#cNote');if(cn)cn.oninput=function(){draft.note=cn.value;};
  var sc=$('#saveCheck');if(sc)sc.onclick=function(){var t=today(),old=state.checkins[t]||{};
    var newSign=draft.signs.some(function(x){return (old.signs||[]).indexOf(x)<0;});
    state.checkins[t]={sleep:draft.sleep,craving:draft.craving,signs:draft.signs.slice(),note:draft.note,saved:true,cleared:newSign?false:!!old.cleared};
    save();render();window.scrollTo(0,0);toast('Check-in saved');};
  var ep=$('#editPlan');if(ep)ep.onclick=function(){if(confirm('Change the plan? Do this only with your doctor. Your record will be kept.')){state.editing=true;render();window.scrollTo(0,0);}};
  var vt=$('#viewTerms');if(vt)vt.onclick=function(){viewTerms=true;render();window.scrollTo(0,0);};
  var cp=$('#copy');if(cp)cp.onclick=function(){copyText(summaryText());};
  var sh=$('#share');if(sh)sh.onclick=function(){navigator.share({title:'Alcohol plan summary',text:summaryText()}).catch(function(){});};
  var pr=$('#print');if(pr)pr.onclick=function(){window.print();};
}

/* refresh at midnight so the day rolls over */
var lastDay=today();
setInterval(function(){if(today()!==lastDay){lastDay=today();draft=null;render();}},60000);
render();
})();
</script>
